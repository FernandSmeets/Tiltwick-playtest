<!DOCTYPE html>
<html lang="nl">
	<head>
		<meta charset="utf-8">
		<!-- No cover fit in the viewport: iOS keeps the page inside the safe area (notch, home bar). -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="theme-color" content="#1c140f">
		<title>Tiltwick: Tiny Troubles</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	background-color: #1c140f;
	overflow: hidden;
	/* No double-tap zoom, no pull-to-refresh, no text selection or callouts. */
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.1rem;
	padding: 2rem;
	background: radial-gradient(circle at 50% 38%, #3a2618 0%, #1c140f 70%);
	color: #f4dfb7;
	font-family: 'Nunito', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
	text-align: center;
	visibility: hidden;
}

#status-house {
	width: 96px;
	height: 96px;
}

#status-title {
	font-size: clamp(1.6rem, 6vw, 2.4rem);
	font-weight: 700;
	letter-spacing: 0.01em;
	margin: 0;
}

#status-line {
	font-size: 1.05rem;
	color: #e8b34b;
	margin: 0;
}

#status-bar {
	width: min(320px, 80vw);
	height: 14px;
	border-radius: 7px;
	background: #2b1d14;
	border: 2px solid #e8b34b;
	overflow: hidden;
}

#status-fill {
	width: 0%;
	height: 100%;
	background: linear-gradient(90deg, #d98c3a, #f4c35b);
	transition: width 0.2s ease-out;
}

#status-fill.waiting {
	width: 35%;
	animation: slide 1.2s ease-in-out infinite alternate;
}

@keyframes slide {
	from { margin-left: 0%; }
	to { margin-left: 65%; }
}

#status-amount {
	font-size: 0.9rem;
	color: rgba(244, 223, 183, 0.75);
	min-height: 1.2em;
	margin: 0;
}

#status-notice {
	display: none;
	max-width: 30rem;
	background: #2b1d14;
	border: 2px solid #e8b34b;
	border-radius: 14px;
	padding: 1.2rem 1.4rem;
	line-height: 1.45;
	font-size: 1rem;
}

#status-notice small {
	display: block;
	margin-top: 0.8rem;
	color: rgba(244, 223, 183, 0.6);
	font-size: 0.8rem;
	word-break: break-word;
}
		</style>
		<meta name="robots" content="noindex,nofollow,noarchive"><link rel="icon" href="index.png"><meta name="referrer" content="no-referrer"><script src="level_files.js"></script><style>html,body{background:#101b25}#canvas{touch-action:none}</style>
	</head>
	<body>
		<canvas id="canvas">
			Je browser kan dit spel niet tonen.
		</canvas>

		<noscript>
			<p style="color:#f4dfb7;font-family:sans-serif;padding:2rem">Zet JavaScript aan om Tiltwick: Tiny Troubles te spelen.</p>
		</noscript>

		<div id="status">
			<svg id="status-house" viewBox="0 0 96 96" aria-hidden="true">
				<polygon points="48,10 88,44 8,44" fill="#c4683f"/>
				<rect x="18" y="44" width="60" height="42" rx="3" fill="#f1e1bf"/>
				<rect x="40" y="58" width="16" height="28" rx="2" fill="#8a5a32"/>
				<rect x="24" y="52" width="12" height="12" rx="2" fill="#7fb2c9"/>
				<rect x="60" y="52" width="12" height="12" rx="2" fill="#7fb2c9"/>
				<rect x="64" y="16" width="9" height="20" fill="#a84f34"/>
			</svg>
			<p id="status-title">Tiltwick: Tiny Troubles</p>
			<p id="status-line">Het Tochthuisje wordt geladen…</p>
			<div id="status-bar"><div id="status-fill" class="waiting"></div></div>
			<p id="status-amount"></p>
			<div id="status-notice"></div>
		</div>

		<script>
// Load timing for the ?meet readout in the game (PlayMeter).
window.tiltwickLoad = { shellMs: performance.now(), readyMs: 0 };
// iOS Safari: no pinch or double-tap zoom of the page itself.
document.addEventListener('gesturestart', (event) => event.preventDefault());
document.addEventListener('dblclick', (event) => event.preventDefault(), { passive: false });
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":5623112,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const status = document.getElementById('status');
	const line = document.getElementById('status-line');
	const bar = document.getElementById('status-bar');
	const fill = document.getElementById('status-fill');
	const amount = document.getElementById('status-amount');
	const notice = document.getElementById('status-notice');
	let initializing = true;

	function showNotice(title, detail) {
		console.error(detail || title);
		line.style.display = 'none';
		bar.style.display = 'none';
		amount.style.display = 'none';
		notice.textContent = title;
		if (detail) {
			const small = document.createElement('small');
			small.textContent = detail;
			notice.appendChild(small);
		}
		notice.style.display = 'block';
		status.style.visibility = 'visible';
		initializing = false;
	}

	function hasWebGL2() {
		try {
			return !!document.createElement('canvas').getContext('webgl2');
		} catch (err) {
			return false;
		}
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (!hasWebGL2()) {
		showNotice('Deze browser kan het spel helaas niet tonen: WebGL 2 ontbreekt of staat uit. '
			+ 'Probeer een recente Safari (iOS 15 of nieuwer), Chrome, Edge of Firefox, '
			+ 'of zet hardwareversnelling aan in de instellingen van je browser.',
			missing.length ? 'Ontbreekt: ' + missing.join(', ') : '');
		return;
	}
	if (missing.length !== 0) {
		showNotice('Deze browser mist iets wat het spel nodig heeft. Probeer een recente Safari, Chrome, Edge of Firefox.',
			'Ontbreekt: ' + missing.join(', '));
		return;
	}

	status.style.visibility = 'visible';
	engine.startGame({
		'onProgress': function (current, total) {
			if (!initializing) {
				return;
			}
			if (current > 0 && total > 0) {
				fill.classList.remove('waiting');
				fill.style.width = Math.min(100, (current / total) * 100).toFixed(1) + '%';
				amount.textContent = (current / 1048576).toFixed(1) + ' van ' + (total / 1048576).toFixed(1) + ' MB';
			} else {
				fill.classList.add('waiting');
				amount.textContent = '';
			}
		},
	}).then(() => {
		window.tiltwickLoad.readyMs = performance.now();
		initializing = false;
		status.remove();
	}, (err) => {
		showNotice('Het spel kon niet starten. Herlaad de pagina; helpt dat niet, probeer dan een andere browser.',
			err instanceof Error ? err.message : String(err || ''));
	});
}());
		</script>
	</body>
</html>
